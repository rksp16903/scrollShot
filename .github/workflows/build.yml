name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

       
      - name: Siapkan source (unzip otomatis)
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "SRC=." >> "$GITHUB_ENV"
          else
            shopt -s nullglob
            zips=(*.zip)
            if [ ${#zips[@]} -eq 0 ]; then
              echo "::error::Tidak ada proyek Gradle maupun file .zip di root repo."
              exit 1
            fi
            echo "Mengekstrak ${zips[0]}"
            mkdir -p _src
            unzip -q -o "${zips[0]}" -d _src
            found=$(find _src -name 'settings.gradle*' -not -path '*/build/*' | head -n1)
            if [ -z "$found" ]; then
              echo "::error::settings.gradle.kts tidak ditemukan di dalam zip."
              exit 1
            fi
            echo "SRC=$(dirname "$found")" >> "$GITHUB_ENV"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: ${{ env.SRC }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Salin APK
        run: cp "${{ env.SRC }}/app/build/outputs/apk/debug/app-debug.apk" ScrollShot.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollShot-APK
          path: ScrollShot.apk

      # APK langsung bisa diunduh dari tab "Releases" (tanpa perlu ekstrak zip).
      - name: Publish ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScrollShot build ${{ github.run_number }}
          files: ScrollShot.apk
